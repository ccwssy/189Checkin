name: Cloud check in action
# 2026-10-01 重写：修 GitHub「疑似恶意 workflow 自动扣留」
#
# 旧版为什么被扣（实测证据）：
#   1) 使用 3 个第三方 action 的浮动引用（@main / @master），
#      其中 shine1594/secrets-to-env-action、nick-fields/retry、Mattraks/delete-workflow-runs
#      都拿到 secrets / github.token，且把全部 secrets 写进 .env 明文文件
#   2) "Keep Running" 步骤把 github.token 拼进 remote URL 后 git push，
#      形成"定时任务自己给自己提 PR/推代码"的循环 —— 风控最强的恶意特征信号
#   3) 仓库公开 + .env 被 git 跟踪（内有 8 位账号密码，与上游示例值完全相同）
#
# 新版做法：
#   - 只用 GitHub 官方 action，且按 commit SHA 固定
#   - 账号密码通过 secrets 直接注入环境变量，不再写 .env 文件、不再过第三方 action
#   - 删除自推送步骤
#   - 显式最小权限
on:
  workflow_dispatch:
  schedule:
    - cron: 35 2 * * *
permissions:
  contents: read
concurrency:
  group: cloud189-checkin
  cancel-in-progress: false
jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: user
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js environment
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Check in
        env:
          # 账号密码直接进环境变量：不落 .env 文件、不经过任何第三方 action
          TY_ACCOUNTS: ${{ secrets.TY_ACCOUNTS }}
          PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
          # 其余推送通道按需打开（值为空则通道自动跳过）
          SENDKEY: ${{ secrets.SENDKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WECOM_BOT_KEY: ${{ secrets.WECOM_BOT_KEY }}
          WECOM_BOT_TELPHONE: ${{ secrets.WECOM_BOT_TELPHONE }}
          WX_PUSHER_APP_TOKEN: ${{ secrets.WX_PUSHER_APP_TOKEN }}
          WX_PUSHER_UID: ${{ secrets.WX_PUSHER_UID }}
          SHOWDOC_KEY: ${{ secrets.SHOWDOC_KEY }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ secrets.BARK_SERVER }}
        run: |
          set -euo pipefail
          if [ -z "${TY_ACCOUNTS:-}" ]; then
            echo "::error::secret TY_ACCOUNTS 未配置"
            exit 1
          fi
          # 兼容 secret 里手抄进来的引号：历史 TY_ACCOUNTS 存的是 '...' 形式
          export TY_ACCOUNTS="${TY_ACCOUNTS%\'}"; export TY_ACCOUNTS="${TY_ACCOUNTS#\'}"
          export TY_ACCOUNTS="${TY_ACCOUNTS%\"}"; export TY_ACCOUNTS="${TY_ACCOUNTS#\"}"
          node -e 'JSON.parse(process.env.TY_ACCOUNTS)' \
            || { echo "::error::TY_ACCOUNTS 不是合法 JSON（请检查 secret 是否多引号/换行）"; exit 1; }
          npm start