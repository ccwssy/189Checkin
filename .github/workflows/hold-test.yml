name: hold-test
# 验证用：加固版签到 workflow，仅手动触发一次，用来判断 GitHub 风控是否仍会扣留
# 加固要点：
# 1. 去掉全部第三方 action（secrets-to-env / retry / delete-workflow-runs），改为内联 run
# 2. 官方 action 按 commit SHA 固定，不用 @main / @master / @v4 浮动引用
# 3. 删掉自推送 "Keep Running"（remote URL 内嵌 token + 自触发循环，风控强信号）
# 4. 显式 permissions: contents: read
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: user
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js environment
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 18
          cache: npm

      - name: Write accounts to .env
        env:
          TY_ACCOUNTS: ${{ secrets.TY_ACCOUNTS }}
        run: |
          set -euo pipefail
          umask 077
          printf 'TY_ACCOUNTS=%s\n' "$TY_ACCOUNTS" > .env
          if [ ! -s .env ]; then echo "::error::TY_ACCOUNTS 为空"; exit 1; fi

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Check in
        run: npm start