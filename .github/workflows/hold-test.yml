name: hold-test
# 加固要点：
# 1. 去掉全部第三方 action（secrets-to-env / retry / delete-workflow-runs），改为内联 run
# 2. 官方 action 全部按 commit SHA 固定，不用 @main / @master / @v4 浮动引用
# 3. 删掉自推送 "Keep Running" 步骤（remote URL 内嵌 token + 自触发循环，风控强信号）
# 4. 显式 permissions: contents: read
on:
  workflow_dispatch:
permissions: contents: read
on:
  workflow_dispatch:
  schedule:
    - cron: 35 2 * * *
permissions:
  contents: read
concurrency:
  group: cloud189-checkin
  cancel-in-progress: false
jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: user
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js environment
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 18
          cache: npm

      - name: Write accounts to .env
        env:
          TY_ACCOUNTS: ${{ secrets.TY_ACCOUNTS }}
        run: |
          set -euo pipefail
          umask 077
          printf 'TY_ACCOUNTS=%s\n' "$TY_ACCOUNTS" > .env
          if [ ! -s .env ]; then echo "::error::TY_ACCOUNTS 为空"; exit 1; fi

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Check in (retry up to 3)
        run: |
          for i in 1 2 3; do
            if npm start; then exit 0; fi
            echo "::warning::签到第 $i 次失败，30 秒后重试"
            sleep 30
          done
          echo "::error::签到连续 3 次失败"
          exit 1